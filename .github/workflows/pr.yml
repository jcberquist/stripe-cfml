name: PRs and Branches

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Tests
    strategy:
      fail-fast: true
      matrix:
        cfengine: ["lucee", "adobe", "boxlang"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          path: stripecfml # checkout as stripecfml because that is how the module installs

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
      
      - name: Install dependencies
        run: cd stripecfml && box install
      
      - name: Start server
        run: cd stripecfml && box server start serverConfigFile=server-${{ matrix.cfengine }}.json port=45000 --noSaveSettings

      - name: Run TestBox Tests
        run: cd stripecfml && box testbox run

  format:
    runs-on: ubuntu-latest
    name: Format
    permissions:
      contents: write
    env:
      CFFORMAT_VERSION: v0.3.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install CFFormat
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/cfformat" "https://github.com/jcberquist/cfformat/releases/download/${CFFORMAT_VERSION}/cfformat_linux_x86_64"
          chmod +x "$RUNNER_TEMP/bin/cfformat"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run CFFormat
        # run the `format` script from box.json directly, without the leading `!` CommandBox uses to shell out
        run: eval "$(jq -r '.scripts.format | ltrimstr("!")' box.json)"

      - name: Commit Format Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Apply cfformat changes
